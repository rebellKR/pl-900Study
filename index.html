<!doctype html>

<style>
/* 레이아웃: 1단 스마트폰 앱형. 위 고정 헤더 + 아래 고정 탭바(学習・問題・設定) */
:root{
  --bg:#f5f6fa; --surface:#ffffff; --fg:#1b1f2e; --muted:#5d6478; --line:#dfe2ec;
  --accent:#5b3fd1; --accent-soft:#ece8fd; --on-accent:#ffffff; --ok:#0f8a5f; --ok-soft:#e2f5ec; --ng:#c8364a; --ng-soft:#fce8eb; --warn:#a86a00; --warn-soft:#fdf3e1;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  --fs:16px; /* 설정에서 바꾸는 글자 크기 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1c1f2b; --fg:#e9ebf3; --muted:#a2a8ba; --line:#2e3242;
  --accent:#a593ff; --accent-soft:#2a2550; --on-accent:#14112b; --ok:#4fd1a0; --ok-soft:#163a2e; --ng:#ff8091; --ng-soft:#40202a; --warn:#f0b54a; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1c1f2b; --fg:#e9ebf3; --muted:#a2a8ba; --line:#2e3242;
  --accent:#a593ff; --accent-soft:#2a2550; --on-accent:#14112b; --ok:#4fd1a0; --ok-soft:#163a2e; --ng:#ff8091; --ng-soft:#40202a; --warn:#f0b54a; --warn-soft:#3a2d14; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.75;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
header.top h1{font-family:var(--f-display);font-size:1.15rem;margin:0;letter-spacing:.02em;flex:1;min-width:0}
header.top h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.85rem;color:var(--muted);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{font-family:var(--f-display);font-size:1.05rem;margin:28px 0 10px;text-wrap:balance}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:.75rem;color:var(--muted)}
.modes,.domains,.list{display:grid;gap:8px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border-radius:14px;padding:14px 16px;font-weight:700;text-align:left;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn small{font-weight:400;font-size:.8rem;opacity:.85}
.btn[disabled]{opacity:.45;cursor:default}
.domain{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.domain .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.domain .name{font-weight:700;font-size:.95rem;min-width:0}
.domain .w{font-size:.75rem;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bar.acc i{background:var(--accent)}
.domain .meta{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted);margin-top:24px}
.note a,.link{color:var(--accent)}
/* 오늘의 학습 카드 */
.today{margin-top:16px;background:var(--accent-soft);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.today .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem}
.today b{font-variant-numeric:tabular-nums}
.today .big{font-family:var(--f-display);font-size:1.1rem}
.chip{display:inline-block;background:var(--surface);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
/* 학습(요약) 화면 */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.sec h3{font-family:var(--f-display);font-size:1.02rem;margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.sec h3 .done{font-family:var(--f-body);font-size:.72rem;color:var(--ok);font-weight:700;margin-left:auto;white-space:nowrap}
.sec ul{margin:0;padding-left:1.2em}
.sec li{margin-bottom:4px}
.terms{display:grid;gap:6px;margin-top:12px}
.terms div{display:grid;grid-template-columns:minmax(6.5em,auto) 1fr;gap:10px;font-size:.9rem;border-top:1px solid var(--line);padding-top:6px}
.terms dt{font-weight:700;color:var(--accent)}
.terms dd{margin:0;min-width:0}
.tip{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.tip b{color:var(--warn)}
.readbtn{margin-top:12px;padding:10px 14px;font-size:.9rem;justify-content:center}
.readbtn.on{color:var(--ok);border-color:var(--ok)}
/* 퀴즈 화면 */
.qhead{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.8rem;color:var(--muted)}
.qhead .tag{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.qhead .count{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.question{font-size:1.08em;font-weight:700;margin:18px 0 14px;line-height:1.8}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;line-height:1.6}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.choice.ok{border-color:var(--ok);background:var(--ok-soft)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.ng{border-color:var(--ng);background:var(--ng-soft)}
.choice.ng .k{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.choice[disabled]{cursor:default}
.verdict{margin-top:18px;font-family:var(--f-display);font-size:1.2rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.exp h3{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:0 0 4px}
.exp p{margin:0 0 12px}
.exp p:last-child{margin-bottom:0}
.exp .plus{border-top:1px dashed var(--line);padding-top:12px}
.exp .plus h3{color:var(--warn)}
.exp a{color:var(--accent);font-size:.85rem}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{justify-content:center}
.mark{flex:0 0 auto;width:auto}
.mark.on{color:var(--warn);border-color:var(--warn)}
.score{text-align:center;margin-top:32px}
.score b{font-family:var(--f-display);font-size:3rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.score p{margin:0;color:var(--muted)}
.review{display:grid;gap:8px}
.review div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:10px;padding:10px 12px;font-size:.9rem}
.review div small{display:block;color:var(--ok);margin-top:4px}
.confirm{background:var(--ng-soft);border:1px solid var(--ng);border-radius:12px;padding:12px;margin-top:12px;font-size:.9rem}
.confirm .actions{margin-top:10px}
/* 설정 화면 */
.profile{margin-top:16px;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem}
.profile b{font-size:1.15rem;display:block}
.profile span{font-size:.8rem;color:var(--muted)}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:none}
.item label,.item .lbl{font-weight:500;min-width:0}
.item .lbl small,.item label small{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:8px;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.switch{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{left:21px}
.item input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.75rem;font-family:ui-monospace,Menlo,monospace}
.msg{font-size:.8rem;color:var(--ok);min-height:1.2em}
/* 학습 단원 화면: PC는 왼쪽 목차 사이드바, 폰은 서랍 메뉴 */
.wrap.wide{max-width:1040px}
.doc{display:block}
.unit{min-width:0;max-width:44em}
.unit .eyebrow{margin:20px 0 0;font-size:.8rem;color:var(--muted);display:flex;gap:10px}
.unit .eyebrow .done{color:var(--ok);font-weight:700}
.unit h2.ut{font-size:1.45rem;margin:4px 0 16px;line-height:1.4}
.unit h3{font-family:var(--f-display);font-size:1.08rem;margin:28px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.unit p{margin:0 0 12px}
.unit ul{margin:0 0 12px;padding-left:1.3em}
.unit li{margin-bottom:4px}
.tbl{overflow-x:auto;margin:4px 0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.6}
.tbl th,.tbl td{padding:8px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl th{background:var(--accent-soft);color:var(--fg);border-top:none;white-space:nowrap;font-size:.8rem}
.tbl td:first-child{font-weight:700;min-width:7em}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:4px 0 14px;font-size:.92rem}
.ex b,.tip b{display:block;font-size:.75rem;letter-spacing:.06em}
.ex b{color:var(--accent)}
.unit .tip{margin:18px 0 14px}
.unit .src{margin-top:20px;font-size:.85rem}
.unit .src a{color:var(--accent)}
.pager{display:flex;gap:8px;margin-top:20px}
.pager .btn{justify-content:center}
.pager #prev{flex:0 0 auto;width:auto}
.side{position:fixed;top:0;bottom:0;left:0;z-index:20;width:min(320px,86vw);background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;transform:translateX(-102%);transition:transform .25s;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(10,12,20,.45)}
.side-head{padding:4px 8px 12px;border-bottom:1px solid var(--line)}
.side-head b{display:block;font-size:.75rem;color:var(--accent)}
.side-head span{font-weight:700;font-size:.9rem;line-height:1.5}
.side ol{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px}
.side ol button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:none;border:none;border-radius:10px;padding:8px;font-size:.88rem;line-height:1.5}
.side ol button.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side .ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.72rem;color:var(--muted)}
.side-foot{border-top:1px solid var(--line);padding-top:8px;display:grid;gap:2px}
.side-foot button{background:none;border:none;text-align:left;padding:6px 8px;font-size:.78rem;color:var(--muted);border-radius:8px}
@media (min-width:900px){
  .doc{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:start}
  .side{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));transform:none;width:auto;max-height:calc(100vh - 160px);border:1px solid var(--line);border-radius:14px;margin-top:20px;padding:12px;z-index:1;transition:none}
  .toc-btn{display:none}
  .scrim{display:none}
}
/* 하단 탭바 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.72rem;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
// ===== 出題範囲(2026年7月24日改訂の公式スキル アウトラインに準拠) =====
const DOMAINS = [
  {id:1, name:"Power Platform のビジネス価値", w:"5–10%", learn:"https://learn.microsoft.com/ja-jp/training/paths/introduction-power-platform/"},
  {id:2, name:"Power Platform 環境の管理(Dataverse・ガバナンス)", w:"20–25%", learn:"https://learn.microsoft.com/ja-jp/training/modules/introduction-common-data-service/"},
  {id:3, name:"Power Apps の機能", w:"20–25%", learn:"https://learn.microsoft.com/ja-jp/training/paths/create-powerapps/"},
  {id:4, name:"Power Automate の機能", w:"20–25%", learn:"https://learn.microsoft.com/ja-jp/training/paths/automate-process-using-flow/"},
  {id:5, name:"Copilot Studio のエージェント", w:"20–25%", learn:"https://learn.microsoft.com/ja-jp/microsoft-copilot-studio/"}
];

// ===== 問題データ =====
// d=分野, q=問題文, c=選択肢, a=正解の番号(0始まり), e=解説, n=補足
const Q = [
// --- 分野1 ビジネス価値 ---
{d:1,q:"Power Platform が「ローコード」と呼ばれる主な理由として、最も適切なものはどれですか。",c:["専門的なプログラミング知識がなくても、画面操作や簡単な数式で業務アプリや自動化を作れるから","すべての機能が無料で使えるから","オンプレミスのサーバーにのみインストールして使うから","コードを書くことが一切禁止されているから"],a:0,e:"ローコードとは、ドラッグ＆ドロップや Excel のような数式を使って、少ないコードでアプリやフローを作れることを指します。現場の業務担当者(市民開発者)が自分で課題を解決できる点が大きな価値です。",n:"プロの開発者がコードで機能を拡張することも可能です。「コード禁止」ではなく「少ないコードでも作れる」という点がポイントです。"},
{d:1,q:"Power Apps、Power Automate、Copilot Studio が共通して利用できる、安全でスケーラブルなデータ保存基盤はどれですか。",c:["Microsoft Dataverse","Microsoft Excel","OneNote","Azure DevOps"],a:0,e:"Microsoft Dataverse は Power Platform の標準データ基盤です。テーブル形式でデータを保存し、セキュリティやビジネス ロジックが組み込まれています。",n:"Excel や SharePoint もデータソースとして使えますが、「Power Platform 共通の基盤」として問われたら Dataverse を選びましょう。"},
{d:1,q:"Power Platform における「コネクタ」の役割はどれですか。",c:["外部のサービスやデータソースと Power Platform をつなぐ橋渡しをする","アプリの画面デザインを自動で整える","ユーザーのライセンスを自動で割り当てる","データベースのバックアップを取る"],a:0,e:"コネクタは、Outlook、SharePoint、Salesforce など様々なサービスの API を包んだ「接続部品」です。アプリやフローから簡単に外部データを読み書きできます。",n:"コネクタには「標準」と「プレミアム」があり、プレミアム コネクタは追加ライセンスが必要です。用意されていないサービスには「カスタム コネクタ」を自作できます。"},
{d:1,q:"毎日届く請求書メールの添付ファイルを SharePoint に保存し、担当者に通知する作業を自動化したい。最適な製品はどれですか。",c:["Power Automate","Power Apps","Power Pages","Microsoft Forms"],a:0,e:"繰り返し発生する手作業の流れ(ワークフロー)を自動化するのは Power Automate の役割です。「メールを受信したとき」をきっかけに、保存や通知を自動で実行できます。",n:"「アプリを作る」なら Power Apps、「作業を自動化する」なら Power Automate、「会話するエージェント」なら Copilot Studio、と目的で覚えるのがコツです。"},
{d:1,q:"社外の顧客がサインインして申請状況を確認できる、ローコードの Web サイトを作りたい。適切な製品はどれですか。",c:["Power Pages","Power Automate デスクトップ","Microsoft Teams","モデル駆動型アプリ"],a:0,e:"Power Pages は、外部ユーザー向けのセキュアなビジネス Web サイトをローコードで作成するサービスです。Dataverse のデータを社外の人に安全に見せることができます。",n:"2026年7月の改訂で Power Pages 単独の分野はなくなりましたが、「ビジネス価値」の分野には引き続き含まれています。"},
{d:1,q:"自然言語で社員からの質問に答えたり、業務を代行したりする「エージェント」を作成できる製品はどれですか。",c:["Microsoft Copilot Studio","Power BI","Power Pages","Dataverse"],a:0,e:"Copilot Studio は、会話型の AI エージェントをローコードで作成・公開できるツールです。ナレッジ(社内文書など)を参照して回答したり、ツールを呼び出して処理を実行したりできます。",n:"以前は Power Virtual Agents という名前でした。古い教材ではこの名前で説明されていることがあります。"},
{d:1,q:"Power Platform の生成 AI(Copilot)機能がもたらす価値として、最も適切なものはどれですか。",c:["作りたいものを自然言語で説明すると、アプリ・フロー・テーブルなどの下書きを自動生成できる","人間による確認なしに本番環境へ自動公開される","ライセンス費用が不要になる","インターネット接続なしで動作する"],a:0,e:"Copilot に「出張申請を管理するアプリを作って」のように話しかけると、必要なテーブルや画面、フローの下書きが作られます。作成のスピードが大幅に上がるのが価値です。",n:"AI が作ったものはあくまで下書きです。内容を確認・修正してから使うのが基本です。"},
{d:1,q:"業務部門の市民開発者と IT 部門のプロ開発者が協力してソリューションを作るチームを何と呼びますか。",c:["フュージョン チーム","セキュリティ グループ","業務単位","テナント"],a:0,e:"フュージョン チームは、業務を知る人とテクノロジーに詳しい人が組んで、素早くソリューションを作る協働の形です。Power Platform はこの働き方を支えます。",n:"「業務単位」は Dataverse のセキュリティ用語、「テナント」は組織全体の契約単位なので混同しないようにしましょう。"},
// --- 分野2 環境の管理 ---
{d:2,q:"Dataverse でデータを保存する基本単位で、Excel のシートのように行と列を持つものはどれですか。",c:["テーブル","フォーム","ビュー","ソリューション"],a:0,e:"Dataverse のデータはテーブルに保存されます。行が 1 件のデータ(レコード)、列が項目(名前、日付など)です。",n:"古い教材では「エンティティ(テーブル)」「フィールド(列)」と呼ばれています。新旧の名前を両方知っておくと安心です。"},
{d:2,q:"1 つの「取引先企業」に複数の「取引先担当者」が所属する関係は、どの種類のリレーションシップですか。",c:["1 対多 (1:N)","多対多 (N:N)","1 対 1","自己参照のみ"],a:0,e:"1 社に対して担当者が複数いるので「1 対多」です。担当者側のテーブルに、どの企業に属するかを示す検索(ルックアップ)列ができます。",n:"「学生」と「授業」のように、お互いに複数ずつ関係する場合は「多対多」です。"},
{d:2,q:"Dataverse の「選択肢」型の列が適しているのはどんな場合ですか。",c:["「高・中・低」のように、決められた候補から値を選ばせたいとき","長い文章を自由に入力させたいとき","画像ファイルを保存したいとき","他のテーブルの行を参照したいとき"],a:0,e:"選択肢(Choice)列は、あらかじめ決めた候補の中から選ばせる列です。入力ミスを防ぎ、集計もしやすくなります。",n:"他テーブルの行を参照するのは「検索(ルックアップ)」列です。"},
{d:2,q:"Dataverse で、複数のレコードを一覧形式で表示するものはどれですか。",c:["ビュー","フォーム","ビジネス ルール","グラフ"],a:0,e:"ビューは、条件で絞り込んだ複数のレコードを一覧表示するものです(例: 「アクティブな取引先企業」)。",n:"1 件のレコードを表示・編集する画面は「フォーム」です。「一覧=ビュー、1 件=フォーム」と覚えましょう。"},
{d:2,q:"コードを書かずに「状態が『完了』のときは完了日を必須にする」といったロジックをテーブルに設定したい。何を使いますか。",c:["ビジネス ルール","セキュリティ ロール","DLP ポリシー","環境変数"],a:0,e:"ビジネス ルールを使うと、条件に応じて列を必須にしたり、値を設定したり、エラーを表示したりするロジックをノーコードで作れます。",n:"ビジネス ロジックには他にも Power Fx による数式列や、Power Automate のフローなどがあります。"},
{d:2,q:"Power Fx の説明として正しいものはどれですか。",c:["Excel の数式に似た、Power Platform 共通のローコード言語","Dataverse のバックアップ形式","Power BI 専用のグラフ種類","管理者専用のコマンドライン ツール"],a:0,e:"Power Fx は Excel の関数に近い書き方ができるローコード言語です。キャンバス アプリの数式や Dataverse の数式列などで使われます。",n:"例: If(Value > 100, \"大\", \"小\") のように、Excel を使ったことがある人ならすぐに読めます。"},
{d:2,q:"開発中のアプリが本番業務に影響しないように、開発・テスト・本番を分けたい。何を使って分けますか。",c:["環境","テーブル","ギャラリー","トピック"],a:0,e:"環境は、アプリ・フロー・データなどを入れておく「箱」です。開発用・テスト用・本番用と分けることで、安全に開発できます。",n:"環境は Power Platform 管理センターで作成・管理します。各環境には最大 1 つの Dataverse データベースを持てます。"},
{d:2,q:"Dataverse で「営業担当者は自分のレコードのみ編集でき、マネージャーは部署全体を見られる」といった権限を設定するものはどれですか。",c:["セキュリティ ロール","ビュー","コネクタ","ソリューション"],a:0,e:"セキュリティ ロールは、テーブルごとに「作成・読み取り・書き込み・削除」などの権限と、その範囲(自分・業務単位・組織など)を定義します。",n:"Dataverse のセキュリティは「業務単位」「セキュリティ ロール」「チーム」などを組み合わせて設計します。"},
{d:2,q:"社内データが個人用の SNS などに送られるのを防ぐため、使えるコネクタの組み合わせを制限したい。何を設定しますか。",c:["データ損失防止 (DLP) ポリシー","ビジネス ルール","キャンバス アプリのテーマ","ナレッジ ソース"],a:0,e:"DLP ポリシーは、コネクタを「ビジネス」「非ビジネス」「ブロック」に分類します。ビジネスと非ビジネスのコネクタを同じアプリやフローで一緒に使えないようにして、データ漏えいを防ぎます。",n:"DLP ポリシーは管理者が Power Platform 管理センターで設定します。環境単位でもテナント全体でも適用できます。"},
{d:2,q:"開発環境で作ったソリューションを、テスト環境、本番環境へと簡単に移動(デプロイ)できる機能はどれですか。",c:["Power Platform のパイプライン","DLP ポリシー","Copilot Studio のチャネル","モデル駆動型アプリのサイトマップ"],a:0,e:"パイプラインは ALM(アプリケーション ライフサイクル管理)を簡単にする機能で、ソリューションを決まった順番で環境間に展開できます。",n:"移動の単位は「ソリューション」です。アプリやフロー、テーブルをソリューションにまとめておくことが前提になります。"},
{d:2,q:"従来の一般的なデータベースと比べた Dataverse の特徴として、正しいものはどれですか。",c:["セキュリティ、ビジネス ロジック、Microsoft 365 などとの統合が最初から組み込まれている","SQL を書かないとテーブルを作れない","1 つのテーブルに 10 行までしか保存できない","Power Platform からは接続できない"],a:0,e:"Dataverse は単なる保存場所ではなく、権限管理、監査、ビジネス ルール、標準テーブルなどがあらかじめ用意されているため、すぐに業務で使えるのが強みです。",n:"「取引先企業」「取引先担当者」などの標準テーブルが最初から入っています(Common Data Model)。"},
{d:2,q:"環境の利用状況やアプリの使用回数などを管理者が確認できる場所はどれですか。",c:["Power Platform 管理センターの分析(モニター)機能","Power Apps Studio のツリー ビュー","Outlook の受信トレイ","Copilot Studio のトピック一覧"],a:0,e:"Power Platform 管理センターでは、環境の管理に加え、容量・利用状況・アクティブ ユーザー数などの分析レポートを確認できます。",n:"ガバナンス強化には「CoE スターター キット」というツール集もあります。"},
{d:2,q:"Copilot を使った Dataverse のテーブル作成について、正しいものはどれですか。",c:["「社員の研修記録を管理したい」など自然言語で説明すると、テーブル・列・リレーションシップの案を作ってくれる","AI が作ったテーブルは編集できない","Excel ファイルがないと使えない","管理者しか利用できない"],a:0,e:"Copilot に作りたいデータを説明すると、必要なテーブルや列、テーブル同士の関係を提案してくれます。提案は自由に編集してから保存できます。",n:"既存の Excel や CSV ファイルを読み込ませて、テーブルを作ることもできます。"},
// --- 分野3 Power Apps ---
{d:3,q:"画面のレイアウトを白紙から自由にデザインでき、多くのデータソースに接続できるアプリはどれですか。",c:["キャンバス アプリ","モデル駆動型アプリ","デスクトップ フロー","Power Pages サイト"],a:0,e:"キャンバス アプリは、PowerPoint のように画面上に部品を自由に配置して作るアプリです。SharePoint、Excel、Dataverse など多くのデータに接続できます。",n:"デザインの自由度が高い反面、画面ごとのレイアウトは自分で調整する必要があります。"},
{d:3,q:"Dataverse のデータ構造(テーブル・フォーム・ビュー)をもとに画面が自動で作られ、レスポンシブに表示されるアプリはどれですか。",c:["モデル駆動型アプリ","キャンバス アプリ","クラウド フロー","エージェント"],a:0,e:"モデル駆動型アプリは、データのモデル(構造)から画面が組み立てられるアプリです。複雑な業務プロセスやデータが多いシステムに向いています。",n:"モデル駆動型アプリのデータは Dataverse に保存されている必要があります。「Dataverse 必須=モデル駆動型」と覚えましょう。"},
{d:3,q:"モデル駆動型アプリについて正しい説明はどれですか。",c:["データソースとして Dataverse を使用する","画面上の部品をピクセル単位で自由に配置するのが基本","SharePoint リストを直接の主データソースにする","オフラインの Excel ファイルのみを使う"],a:0,e:"モデル駆動型アプリは Dataverse を前提に作られます。画面の見た目はコンポーネントベースで、デバイスに合わせて自動調整されます。",n:"キャンバス アプリと比べると、デザインの自由度より「早く一貫した業務システムを作れること」が強みです。"},
{d:3,q:"キャンバス アプリで、複数のレコードを一覧表示するためのコントロールはどれですか。",c:["ギャラリー","ボタン","テキスト入力","タイマー"],a:0,e:"ギャラリーは、データソースの複数の行を繰り返し表示するコントロールです。商品一覧や申請一覧などに使います。",n:"1 件のレコードを表示・編集するには「フォーム」コントロール(表示フォーム/編集フォーム)を使います。"},
{d:3,q:"キャンバス アプリで、ボタンを押したときに別の画面へ移動させる Power Fx 関数はどれですか。",c:["Navigate","Patch","Filter","Sum"],a:0,e:"Navigate(画面名) で指定した画面に移動できます。ボタンの OnSelect プロパティに書くのが一般的です。",n:"Patch はデータの作成・更新、Filter は絞り込み、Sum は合計です。よく出る関数なので役割を覚えておきましょう。"},
{d:3,q:"Copilot を使ってアプリを作る方法として正しいものはどれですか。",c:["作りたいアプリを自然言語で説明すると、テーブルとアプリの画面が生成される","コードを貼り付けないと生成されない","生成できるのはモデル駆動型アプリだけである","英語でしか指示できない"],a:0,e:"Power Apps のホーム画面で「備品の貸し出しを管理するアプリ」などと入力すると、Copilot がデータ構造とアプリを提案します。その後も会話しながら修正できます。",n:"日本語での指示にも対応しています。出題範囲では、キャンバス アプリとモデル駆動型アプリの両方を AI で作れることが問われます。"},
{d:3,q:"業務の課題を説明すると、関係するユーザーやプロセスを整理し、必要なテーブル・アプリ・フローなどをまとめて提案してくれる Power Apps の機能はどれですか。",c:["Plan designer(計画デザイナー)","ギャラリー","DLP ポリシー","サイトマップ"],a:0,e:"Plan designer は、課題の説明から「誰が使うか」「どんな流れか」「どんなデータが必要か」を整理し、ソリューション全体の計画を AI が提案する機能です。",n:"新しい機能のため、日本語の画面名は変わる可能性があります(推測を含みます)。Microsoft Learn で最新の名称を確認してください。"},
{d:3,q:"プロの開発者が使い慣れたコード(React など)でアプリを作り、Power Platform のコネクタや管理機能を利用しながら実行できるアプリの種類はどれですか。",c:["コード アプリ","モデル駆動型アプリ","デスクトップ フロー","Power Pages のテンプレート"],a:0,e:"コード アプリは、コード ファーストで開発した Web アプリを Power Platform 上で動かす仕組みです。コネクタや認証、ガバナンスを Power Platform のものとして使えます。",n:"比較的新しい機能です(推測を含みます)。試験では「キャンバス・モデル駆動型・コード アプリの使い分け」を意識しておきましょう。"},
{d:3,q:"既存の Excel ファイルや SharePoint リストからすぐにアプリを作りたい場合、最も手早い方法はどれですか。",c:["データソースを指定してキャンバス アプリを自動生成する","モデル駆動型アプリのサイトマップを編集する","Copilot Studio でトピックを作る","デスクトップ フローを録画する"],a:0,e:"Power Apps では、データソースを選ぶだけで「一覧・詳細・編集」の 3 画面を持つキャンバス アプリが自動で作られます。",n:"Excel ファイルは OneDrive などクラウドに保存し、データを「テーブル」として書式設定しておく必要があります。"},
{d:3,q:"アプリを他のユーザーに使ってもらうための操作として正しいものはどれですか。",c:["アプリを共有し、ユーザーに必要なデータへのアクセス権も付与する","アプリの .exe ファイルをメールで送る","DLP ポリシーを削除する","環境を削除して作り直す"],a:0,e:"Power Apps ではアプリを個人やグループに共有します。アプリ自体の共有だけでなく、データソース(Dataverse のセキュリティ ロールなど)へのアクセス権も必要です。",n:"共有されたアプリは、ブラウザーやスマホの Power Apps モバイル アプリから使えます。"},
// --- 分野4 Power Automate ---
{d:4,q:"「新しいメールを受信したとき」に自動的に開始されるフローの種類はどれですか。",c:["自動化したクラウド フロー","インスタント クラウド フロー","スケジュール済みクラウド フロー","デスクトップ フロー"],a:0,e:"何かのイベント(メール受信、ファイル作成など)をきっかけに自動で動くのが「自動化したクラウド フロー」です。",n:"クラウド フローは「自動化」「インスタント」「スケジュール済み」の 3 種類。試験でよく問われます。"},
{d:4,q:"ユーザーがボタンをタップしたときに、手動で開始するフローの種類はどれですか。",c:["インスタント クラウド フロー","自動化したクラウド フロー","スケジュール済みクラウド フロー","ビジネス プロセス フロー"],a:0,e:"インスタント クラウド フローは、ボタンやアプリ、Teams のメッセージなどから人が手動で実行するフローです。",n:"Power Apps のボタンからフローを呼び出すのもインスタント フローの代表的な使い方です。"},
{d:4,q:"毎週月曜日の朝 9 時にレポートを送信したい。どのフローを使いますか。",c:["スケジュール済みクラウド フロー","インスタント クラウド フロー","自動化したクラウド フロー","デスクトップ フロー(有人)"],a:0,e:"決まった日時や間隔で繰り返し実行するのはスケジュール済みクラウド フローです。",n:"タイム ゾーンの設定に注意しましょう。日本で使う場合は (UTC+09:00) 大阪、札幌、東京 を選びます。"},
{d:4,q:"API が用意されていない古い社内システムの画面操作を、人の代わりに自動で行いたい。何を使いますか。",c:["デスクトップ フロー (RPA)","自動化したクラウド フロー","ビジネス ルール","ナレッジ ソース"],a:0,e:"デスクトップ フローは、マウス操作やキー入力を記録・再現する RPA(ロボティック プロセス オートメーション)の機能です。API がないアプリも自動化できます。",n:"作成には Windows 用の Power Automate for desktop を使います。"},
{d:4,q:"フローを構成する要素のうち、「フローを開始するきっかけ」はどれですか。",c:["トリガー","アクション","コネクタ","変数"],a:0,e:"フローは「トリガー(きっかけ)」と「アクション(実行する処理)」でできています。1 つのフローにトリガーは 1 つ、アクションは複数置けます。",n:"例: トリガー「Forms に回答が送信されたとき」→ アクション「回答の詳細を取得」→「SharePoint に項目を作成」。"},

1:[
{id:"1-1",t:"Power Platform とは",min:5,src:ML+"power-platform/",body:`
Microsoft Power Platform は、業務アプリ、業務の自動化、AI エージェント、Web サイトを「ローコード」で作るための製品群です。それぞれの製品は単独でも使えますが、同じデータ基盤と接続の仕組みを共有しているため、組み合わせることで大きな効果を発揮します。
## 主な製品
| 製品 | できること | 代表的な例 |
| Power Apps | 業務アプリを作る | 備品の貸出管理アプリ、現場点検アプリ |
| Power Automate | 作業の流れを自動化する | 申請の承認、メール添付の自動保存 |
| Copilot Studio | 会話型の AI エージェントを作る | 社内ヘルプデスク、人事 FAQ |
| Power Pages | 社外の人も使える Web サイトを作る | 顧客向けの申請・問い合わせポータル |
## 製品を支える共通の土台
- Microsoft Dataverse: データを安全に保存・管理する共通のデータ基盤
- コネクタ: Microsoft 365 や外部サービスとつなぐ部品
- Power Fx: Excel の数式に似たローコード言語
- 生成 AI(Copilot): 自然言語での作成・編集を手伝う機能
> 例: 出張申請を Power Apps で入力 → Power Automate で上司に承認依頼 → データは Dataverse に保存 → よくある質問には Copilot Studio のエージェントが回答。
! 「〜したい」という要件から正しい製品を選ぶ問題が定番です。アプリ=Power Apps、自動化=Power Automate、会話=Copilot Studio、外部向けサイト=Power Pages。
`},
{id:"1-2",t:"ローコード開発と市民開発者",min:5,src:ML+"power-platform/guidance/adoption/citizen-developer",body:`
ローコードとは、ドラッグ＆ドロップの画面操作や Excel のような数式を使い、少ないコードでソリューションを作る開発手法です。従来は IT 部門や外部のベンダーに頼んでいたシステム作りを、業務の現場で進められるようになります。
## ローコードがもたらすビジネス価値
- 開発スピード: 数か月かかっていた開発が、数日〜数週間で形になる
- コスト削減: 外注費や開発工数を減らせる
- 業務に合ったツール: 業務を一番よく知る人が、自分で課題を解決できる
- 変化への対応: 業務が変わったら、すぐにアプリやフローを直せる
## 誰が作るのか
| 役割 | 説明 |
| 市民開発者 | IT の専門家ではないが、ローコードでアプリや自動化を作る業務担当者 |
| プロ開発者 | コードで機能を拡張したり、カスタム コネクタを作ったりする専門家 |
| フュージョン チーム | 市民開発者・プロ開発者・IT 管理者が協力して作るチーム |
IT 部門は、環境の管理やデータ損失防止 (DLP) ポリシーなどの「ガバナンス」で、現場の自由な開発と安全性を両立させます。
! ローコードは「コードを書いてはいけない」という意味ではありません。必要に応じてプロ開発者がコードで拡張できる点もセットで覚えましょう。
`},
{id:"1-3",t:"コネクタと Dataverse の価値",min:6,src:ML+"connectors/connectors",body:`
## コネクタ
コネクタは、外部のサービスの API(機能の呼び出し口)を包んで、Power Platform から簡単に使えるようにした部品です。1,000 種類以上が用意されており、プログラミングなしでデータの読み書きができます。
| 種類 | 説明 | 例 |
| 標準コネクタ | Microsoft 365 などのライセンスで利用できる | SharePoint、Outlook、Teams、OneDrive |
| プレミアム コネクタ | 追加の有料ライセンスが必要 | Dataverse、SQL Server、Salesforce、HTTP |
| カスタム コネクタ | 用意されていない API 用に自作する | 社内システムの独自 API |
コネクタは「トリガー(きっかけ)」と「アクション(処理)」を提供します。たとえば Outlook コネクタには「新しいメールが届いたとき」というトリガーと、「メールを送信する」というアクションがあります。
## Dataverse
Dataverse は Power Platform の標準データ基盤です。単なるデータの保存場所ではなく、セキュリティ、ビジネス ルール、監査ログ、標準テーブルなど、業務で使うための仕組みが最初から組み込まれています。
- Power Apps、Power Automate、Copilot Studio、Power Pages から共通で利用できる
- Dynamics 365 のデータも Dataverse に保存されている
- 「取引先企業」「取引先担当者」などの標準テーブルがすぐに使える
! Dataverse コネクタはプレミアム扱い、という点がよく問われます。
`},
{id:"1-4",t:"生成 AI・Copilot Studio・Power Pages の価値",min:6,src:ML+"power-platform/copilot",body:`
## 生成 AI(Copilot)機能
Power Platform の各製品には Copilot が組み込まれています。作りたいものを自然言語で伝えると、AI が下書きを作ってくれます。
- Power Apps: 「備品の貸出を管理したい」と伝えると、テーブルとアプリを生成
- Power Automate: 「Forms の回答を Teams に通知して」と伝えると、フローを生成
- Dataverse: 説明から、テーブル・列・リレーションシップの案を生成
AI が作ったものはあくまで「下書き」です。内容を人が確認・修正してから使うことが、責任ある AI の基本的な考え方です。
## Copilot Studio の価値
Copilot Studio では、会話型の AI エージェントをローコードで作れます。社内文書をナレッジとして読み込ませて質問に答えさせたり、ツールを使って申請の登録などの処理を代行させたりできます。問い合わせ対応の負担を減らし、24 時間いつでも回答できる窓口を作れます。
## Power Pages の価値
Power Pages は、社外の顧客やパートナーが使えるセキュアな Web サイトをローコードで作るサービスです。Dataverse のデータを、権限を管理しながら外部の人に見せたり入力してもらったりできます。
! 2026年7月の改訂で Power Pages 単独の分野はなくなりましたが、「ビジネス価値」の中で問われる可能性があります。
`},
{id:"1-5",t:"Microsoft 365・Dynamics 365・Azure との連携",min:4,src:ML+"power-platform/",body:`
Power Platform の強みの 1 つは、Microsoft の他のサービスと深く連携できることです。
| サービス | 連携の例 |
| Microsoft 365 | Teams の中でアプリを使う、SharePoint リストをデータにする、Outlook のメールで承認する |
| Dynamics 365 | 営業・顧客サービスなどの業務アプリ。データは Dataverse にあり、Power Apps で拡張できる |
| Azure | Azure Functions などのクラウド サービスと連携し、プロ開発者が高度な処理を追加できる |
| Microsoft Entra ID | 組織のアカウントでサインインし、アクセス権を一元管理する |
社員が毎日使っている Teams や Outlook の中で、アプリや承認、エージェントが動くため、新しいツールを覚える負担が少なく、定着しやすいのが価値です。
! 「Teams の中で使いたい」「普段のメールで承認したい」といった要件には、Power Platform と Microsoft 365 の連携が答えになります。
`}
],
2:[
{id:"2-1",t:"Dataverse と従来のデータベースの違い",min:5,src:ML+"power-apps/maker/data-platform/data-platform-intro",body:`
従来のデータベース(SQL Server など)は、データを保存する仕組みは強力ですが、セキュリティ、画面、業務ルールなどは自分で作る必要がありました。Dataverse は、それらが最初から組み込まれた「業務向けのデータ基盤」です。
| 観点 | 従来のデータベース | Dataverse |
| 作成方法 | SQL などで設計 | ブラウザーの画面や Copilot で作成 |
| セキュリティ | 自分で設計・実装 | セキュリティ ロール、業務単位などが組み込み |
| 業務ロジック | プログラムで実装 | ビジネス ルール、数式列、フローで設定 |
| 標準データ | なし | 取引先企業などの標準テーブル(Common Data Model) |
| 連携 | 個別に開発 | Power Platform・Dynamics 365・Microsoft 365 と統合 |
Dataverse は、Excel や SharePoint リストよりも大量のデータ、複雑なリレーションシップ、細かい権限管理が必要な場合に向いています。
! 「セキュリティやビジネス ロジックが組み込まれている」「標準テーブルがある」が Dataverse を選ぶ理由として問われます。
`},
{id:"2-2",t:"テーブル・列・行",min:6,src:ML+"power-apps/maker/data-platform/types-of-fields",body:`
Dataverse のデータは「テーブル」に保存されます。Excel のシートにたとえると、テーブル=シート、列=見出しの項目、行=1 件のデータです。
## テーブルの種類
| 種類 | 説明 |
| 標準テーブル | 最初から用意されている(取引先企業、取引先担当者など) |
| カスタム テーブル | 自分で作るテーブル(備品、研修記録など) |
| 仮想テーブル | 外部のデータを、Dataverse に取り込まずに表示する |
| エラスティック テーブル | 大量データの高速な読み書き向け |
## 主な列のデータ型
- テキスト、複数行テキスト
- 整数、小数、通貨
- 日付と時刻
- はい/いいえ
- 選択肢(1 つ選ぶ)、選択肢(複数選べる)
- 検索(ルックアップ): 他のテーブルの行を参照する
- ファイル、画像
- 数式: Power Fx で他の列から値を計算する
- オートナンバー: 申請番号などを自動で採番する
## 新旧の名称
| 現在の名称 | 以前の名称 |
| テーブル | エンティティ |
| 列 | フィールド、属性 |
| 行 | レコード |
| 選択肢 | オプション セット |
! 古い教材の「エンティティ」「フィールド」は、現在の「テーブル」「列」と同じ意味です。両方で出題されることがあります。
`},
{id:"2-3",t:"リレーションシップ",min:5,src:ML+"power-apps/maker/data-platform/create-edit-1n-relationships",body:`
リレーションシップは、テーブル同士のつながりを定義するものです。
| 種類 | 意味 | 例 |
| 1 対多 (1:N) | 1 行に対して、相手側の複数の行が関係する | 1 つの取引先企業に、複数の取引先担当者 |
| 多対 1 (N:1) | 1:N を相手側から見たもの | 担当者から見ると、所属企業は 1 つ |
| 多対多 (N:N) | お互いに複数ずつ関係する | 学生と授業、社員とプロジェクト |
1 対多のリレーションシップを作ると、「多」側のテーブルに検索(ルックアップ)列が追加されます。たとえば取引先担当者テーブルに「所属企業」という検索列ができ、どの企業の担当者かを選べるようになります。
## リレーションシップの動作
親の行を削除したときに子の行をどうするか(一緒に削除する、関連付けを解除する、削除を禁止する など)も設定できます。
> 例: 取引先企業を削除すると、その企業に関連する商談も削除される(連鎖削除)。
! 「1 社に複数の担当者」は 1 対多、「お互いに複数」は多対多。設問の文章からどちらかを判断できるようにしましょう。
`},
{id:"2-4",t:"フォームとビュー",min:5,src:ML+"power-apps/maker/model-driven-apps/create-design-forms",body:`
フォームとビューは、Dataverse のデータを画面に表示するための部品で、主にモデル駆動型アプリで使われます。
## フォーム(1 件のレコード)
| フォームの種類 | 用途 |
| メイン | 1 件のレコードを表示・編集する基本の画面 |
| 簡易作成 | 最小限の項目だけで素早くレコードを作る |
| 簡易表示 | 関連するレコードの情報を、別のフォームの中に表示する |
| カード | 一覧などで使うコンパクトな表示 |
## ビュー(複数レコードの一覧)
ビューは、条件で絞り込み、並べ替えた複数のレコードを一覧表示します。
- パブリック ビュー: 全員が使える(例: アクティブな取引先企業)
- 個人用ビュー: 自分で作った自分専用のビュー
- システム ビュー: 検索や関連レコードの表示などに使われる特別なビュー
! 「一覧=ビュー」「1 件=フォーム」。この区別は頻出です。
`},
{id:"2-5",t:"ビジネス ロジックと Power Fx",min:6,src:ML+"power-apps/maker/data-platform/data-platform-create-business-rule",body:`
ビジネス ロジックとは、「この条件のときはこうする」という業務のルールのことです。Dataverse では、コードを書かずにさまざまなロジックを設定できます。
## ビジネス ルール
画面上のデザイナーで条件と動作を組み立てる、ノーコードの仕組みです。
- 列の値を設定する、クリアする
- 列を必須にする、任意にする
- 列を表示・非表示にする、編集可能・不可にする(フォーム上)
- エラー メッセージを表示する
> 例: 「状態」が「完了」になったら「完了日」を必須にする。
スコープを「テーブル」にすると、フォームに関係なくサーバー側で常に適用されます。
## Power Fx
Power Fx は、Excel の数式に近い書き方ができる Power Platform 共通のローコード言語です。キャンバス アプリの動作や、Dataverse の数式列で使われます。
> 例: If(金額 > 100000, "要承認", "自動承認")
## その他の方法
- Power Automate のクラウド フロー: 行が追加・変更されたときに処理を実行
- プラグイン: プロ開発者が C# で作る高度な処理
## AI を使ったテーブル作成
Copilot に「社員の研修記録を管理したい」などと説明すると、テーブル、列、リレーションシップの案が作られます。提案は編集してから保存できます。既存の Excel や CSV ファイルからテーブルを作ることもできます。
! ノーコードで「必須にする」「値を設定する」「エラーを表示する」と出てきたら、ビジネス ルールが答えです。
`},
{id:"2-6",t:"環境",min:6,src:ML+"power-platform/admin/environments-overview",body:`
環境は、アプリ、フロー、エージェント、データなどを入れておく「箱」です。用途ごとに環境を分けることで、開発中の変更が本番業務に影響しないようにできます。
- 1 つの環境には、Dataverse のデータベースを最大 1 つ作れる
- 環境ごとにセキュリティ(誰が使えるか)やデータの保存地域を設定できる
- 環境の作成や管理は Power Platform 管理センターで行う
## 環境の種類
| 種類 | 特徴 |
| 既定 | テナントに自動で作られ、全員が作成者として使える。本番業務には不向き |
| 運用(本番) | 実際の業務で使う環境 |
| サンドボックス | 開発やテスト用。リセットやコピーができる |
| 試用版 | 30 日間などの期限付きで試す環境 |
| 開発者 | 個人が学習・開発に使う環境 |
| Dataverse for Teams | Teams の中で使う簡易な環境 |
## マネージド環境
マネージド環境を有効にすると、利用状況の分析、共有の制限、ソリューションのチェックなど、管理者向けの追加機能を使えます。
> 例: 「開発」「テスト」「本番」の 3 つの環境を用意し、完成したものだけを本番に展開する。
! 「本番に影響を与えずにテストしたい」→ 別の環境(サンドボックス)を使う、が正解パターンです。
`},
{id:"2-7",t:"セキュリティ モデル",min:7,src:ML+"power-platform/admin/wp-security",body:`
Power Platform のセキュリティは、「誰であるか(認証)」と「何ができるか(承認)」の 2 段階で考えます。
## 認証
サインインは Microsoft Entra ID(旧 Azure Active Directory)で行います。組織のアカウントで一元管理されるため、退職者のアカウントを無効にすれば、すべてのアプリにアクセスできなくなります。
## Dataverse の権限管理
| 仕組み | 説明 |
| 業務単位 | 部署などの組織構造。データの所有範囲の区切りになる |
| セキュリティ ロール | テーブルごとに、どの操作をどの範囲でできるかを定義する |
| チーム | 複数のユーザーをまとめ、ロールやレコードの所有を共有する |
| 列レベル セキュリティ | 給与など特定の列だけを、許可された人にしか見せない |
| 階層セキュリティ | 上司が部下のデータを見られるようにする |
## セキュリティ ロールの権限と範囲
権限には、作成・読み取り・書き込み・削除・追加・追加先・割り当て・共有があります。それぞれに範囲を設定します。
| 範囲 | 対象 |
| ユーザー | 自分が所有するレコードだけ |
| 業務単位 | 自分の部署のレコード |
| 親:子業務単位 | 自分の部署と、その下の部署 |
| 組織 | 組織全体のレコード |
> 例: 営業担当者は「ユーザー」範囲で書き込み、営業マネージャーは「業務単位」範囲で読み取り。
! 「テーブルごとの操作権限」→ セキュリティ ロール、「特定の列だけ隠す」→ 列レベル セキュリティ。
`},
{id:"2-8",t:"データ プライバシー・DLP・アクセシビリティ",min:6,src:ML+"power-platform/admin/wp-data-loss-prevention",body:`
## データ損失防止 (DLP) ポリシー
DLP ポリシーは、社内のデータが意図しない場所へ流出するのを防ぐためのルールです。管理者がコネクタを次の 3 つに分類します。
| 分類 | 意味 |
| ビジネス | 業務データを扱ってよいコネクタ(SharePoint、Dataverse など) |
| 非ビジネス | 個人向けなど、業務データと混ぜたくないコネクタ |
| ブロック | 使用を禁止するコネクタ |
「ビジネス」と「非ビジネス」のコネクタは、同じアプリやフローの中で一緒に使えません。これにより、社内データを個人の SNS やストレージに送るような仕組みを作れなくします。DLP ポリシーはテナント全体にも、特定の環境にも適用できます。
## データ プライバシー
- 環境ごとにデータの保存地域を選べる(日本で作れば日本のデータセンターに保存)
- データは保存時・通信時に暗号化される
- 監査ログで、誰がいつデータを変更したかを記録できる
## アクセシビリティ
誰でも使えるアプリを作ることも大切です。Power Apps にはアクセシビリティ チェッカーがあり、スクリーン リーダー用のラベルや色のコントラストなどの問題を確認できます。
! 「ビジネスと非ビジネスのコネクタを同じフローで使えないようにする」が DLP の核心です。
`},
{id:"2-9",t:"監視・分析と ALM(パイプライン)",min:7,src:ML+"power-platform/alm/pipelines",body:`
## 監視と分析
Power Platform 管理センターでは、環境ごとの容量、アクティブ ユーザー数、アプリやフローの利用状況などを確認できます。さらに大規模な管理には、CoE(センター オブ エクセレンス)スターター キットというツール集も使われます。
## ALM(アプリケーション ライフサイクル管理)
ALM とは、アプリやフローを「開発 → テスト → 本番」と安全に移していく管理の方法です。
| 用語 | 説明 |
| ソリューション | アプリ、フロー、テーブルなどをまとめて運ぶための入れ物 |
| アンマネージド ソリューション | 開発環境で使う、編集できるソリューション |
| マネージド ソリューション | テスト・本番環境に入れる、直接編集できないソリューション |
| 環境変数 | 環境ごとに変わる値(URL など)を外から設定する仕組み |
| 接続参照 | ソリューションの中で使う接続を、環境ごとに切り替える仕組み |
## Power Platform のパイプライン
パイプラインは、ソリューションの展開を簡単にする機能です。管理者が「開発 → テスト → 本番」という流れを一度設定しておけば、作成者はボタン操作で次の環境に展開できます。
> 例: 開発環境で完成したアプリを、パイプラインでテスト環境へ展開し、確認後に本番環境へ展開する。
! 開発環境ではアンマネージド、本番環境にはマネージド ソリューション。環境間の移動にはパイプライン。
`}
],
3:[
{id:"3-1",t:"Power Apps とアプリの種類",min:5,src:ML+"power-apps/powerapps-overview",body:`
Power Apps は、業務アプリをローコードで作るサービスです。作ったアプリはブラウザー、スマートフォンの Power Apps モバイル アプリ、Teams などで使えます。
## アプリの種類と使い分け
| 種類 | 特徴 | 向いている場面 |
| キャンバス アプリ | 白紙の画面に部品を自由に配置する。多くのデータソースに接続できる | 見た目や操作性を細かく作り込みたい、SharePoint や Excel のデータを使いたい |
| モデル駆動型アプリ | Dataverse のデータ構造から画面が組み立てられる | データが多く複雑な業務、統一された画面で素早く作りたい |
| コード アプリ | プロ開発者がコードで作り、Power Platform 上で動かす | 独自の UI をコードで作りたいが、コネクタや管理機能は使いたい |
> 例: 現場の点検をスマホで記録 → キャンバス アプリ。顧客・商談・契約を一元管理 → モデル駆動型アプリ。
! 「Dataverse 必須・画面は自動」→ モデル駆動型。「デザイン自由・多様なデータソース」→ キャンバス。
`},
{id:"3-2",t:"キャンバス アプリの作り方",min:8,src:ML+"power-apps/maker/canvas-apps/getting-started",body:`
キャンバス アプリは Power Apps Studio という編集画面で作ります。PowerPoint のスライドに図形を置くように、画面(スクリーン)にコントロールを配置していきます。
## 作り始め方
- 白紙から作る
- データから作る: SharePoint リストや Excel を選ぶと、一覧・詳細・編集の 3 画面アプリが自動で作られる
- テンプレートから作る
- Copilot に説明して作る
## 主なコントロール
| コントロール | 役割 |
| ギャラリー | 複数のレコードを繰り返し表示する一覧 |
| フォーム(表示/編集) | 1 件のレコードを表示・編集する |
| ボタン | 押したときに処理を実行する |
| テキスト入力、ドロップダウン | 値を入力・選択する |
| ラベル | 文字を表示する |
## Power Fx で動きを付ける
コントロールのプロパティに数式を書いて動作を決めます。たとえばボタンの OnSelect プロパティは「押されたとき」の動作、ギャラリーの Items プロパティは「表示するデータ」です。
| 関数 | 役割 |
| Navigate | 別の画面に移動する |
| Back | 前の画面に戻る |
| Filter / Search | 条件で絞り込む / 文字で検索する |
| LookUp | 条件に合う 1 件を取得する |
| Patch | レコードを作成・更新する |
| SubmitForm | フォームの内容を保存する |
| Set / UpdateContext | 変数に値を入れる |
## 委任(デリゲーション)
大量のデータを扱うとき、絞り込みなどの処理をデータソース側に任せることを「委任」といいます。委任できない数式を使うと、先頭の一部(既定では 500 件)しか処理されないため注意が必要です。
! Excel をデータソースにするときは、OneDrive などのクラウドに保存し、表を「テーブル」として書式設定しておく必要があります。
`},
{id:"3-3",t:"モデル駆動型アプリの構成",min:6,src:ML+"power-apps/maker/model-driven-apps/model-driven-app-overview",body:`
モデル駆動型アプリは、「データの設計」を中心に作るアプリです。Dataverse のテーブル、フォーム、ビューを組み合わせると、画面は自動で組み立てられ、PC でもスマホでも見やすく表示されます(レスポンシブ)。
## 構成要素
| 要素 | 役割 |
| テーブル | アプリで扱うデータ |
| フォーム | 1 件のレコードの表示・編集画面 |
| ビュー | レコードの一覧 |
| グラフ・ダッシュボード | データを視覚的にまとめて表示する |
| サイトマップ | 画面左側のナビゲーション(メニュー)の構成 |
| ビジネス プロセス フロー | 業務の段階を画面上部に表示し、手順をガイドする |
| カスタム ページ | キャンバス アプリのように自由にデザインしたページを追加する |
> 例: 営業の流れを「見込み → 提案 → 交渉 → 成約」とビジネス プロセス フローで表示し、各段階で入力すべき項目を案内する。
アクセスできるデータは Dataverse のセキュリティ ロールで制御されるため、同じアプリでも人によって見えるデータを変えられます。
! モデル駆動型アプリのデータは必ず Dataverse に保存します。レイアウトの自由度よりも、一貫した画面と開発スピードが強みです。
`},
{id:"3-4",t:"Plan designer とコード アプリ",min:5,src:ML+"power-apps/",body:`
出題範囲には、比較的新しい 2 つの機能が含まれています。名称や画面は変わる可能性があるため、試験前に Microsoft Learn で最新情報を確認してください(この単元は推測を含みます)。
## Plan designer
業務の課題を自然言語で説明すると、AI がソリューション全体の計画を提案してくれる機能です。
- 誰が使うのか(ユーザーの役割)
- どのような業務の流れか(プロセス)
- どのようなデータが必要か(テーブル)
- 作るべきアプリ、フロー、エージェントは何か
提案された計画をもとに、アプリやテーブルを作り始められます。いきなりアプリを作るのではなく、「まず計画を立てる」ところから AI が手伝うのが特徴です。
## コード アプリ
プロ開発者が、使い慣れたツールとコード(React や TypeScript など)で Web アプリを作り、それを Power Platform 上で動かす仕組みです。コードで自由に作りながら、Power Platform のコネクタ、認証、DLP などの管理機能をそのまま利用できます。
> 使い分け: 市民開発者がローコードで作る → キャンバス/モデル駆動型。プロ開発者がコードで作り、管理は Power Platform に任せる → コード アプリ。
! キャンバス・モデル駆動型・コード アプリの 3 種類の違いを、作る人と作り方で整理しておきましょう。
`},
{id:"3-5",t:"AI でアプリを作る・共有と利用",min:6,src:ML+"power-apps/maker/canvas-apps/ai-overview",body:`
## Copilot でアプリを作る
Power Apps のホーム画面で、作りたいアプリを自然言語で説明すると、Copilot が必要なテーブルとアプリを生成します。その後も「列を追加して」「画面の色を変えて」などと会話しながら修正できます。日本語での指示にも対応しています。
- キャンバス アプリもモデル駆動型アプリも AI で作成できる
- 会話しながら AI と一緒にアプリを作り上げていく新しい作成体験も、出題範囲に含まれている
- アプリの中に Copilot を組み込み、利用者がデータについて質問できるようにすることもできる
## アプリの共有
完成したアプリは、ユーザーやセキュリティ グループに共有して使ってもらいます。
| アプリ | 共有の方法 |
| キャンバス アプリ | アプリをユーザーやグループに共有。共同所有者にすると編集もできる |
| モデル駆動型アプリ | Dataverse のセキュリティ ロールを割り当てて共有 |
アプリを共有しても、データソースへのアクセス権がなければデータは見られません。SharePoint リストの権限や Dataverse のセキュリティ ロールも合わせて設定する必要があります。
## 使う場所
ブラウザー、Power Apps モバイル アプリ(iOS / Android)、Teams、SharePoint のページへの埋め込みなど、さまざまな場所で使えます。
! 「アプリを共有したのにデータが見えない」→ データソース側の権限が不足している、が典型的な答えです。
`}
],
4:[
{id:"4-1",t:"Power Automate とフローの種類",min:6,src:ML+"power-automate/overview-cloud",body:`
Power Automate は、繰り返し発生する作業の流れ(ワークフロー)を自動化するサービスです。人が手作業でやっていた「メールを確認して、ファイルを保存して、担当者に連絡する」といった作業を、決められた手順で自動実行できます。
## フローの種類
| 種類 | 開始のきっかけ | 例 |
| 自動化したクラウド フロー | イベント(何かが起きたとき) | メールを受信したとき、ファイルが追加されたとき |
| インスタント クラウド フロー | 人の操作(ボタンなど) | アプリのボタン、Teams のメッセージから実行 |
| スケジュール済みクラウド フロー | 日時・間隔 | 毎朝 9 時、毎週月曜日 |
| デスクトップ フロー | PC の画面操作を自動化(RPA) | API のない古いシステムへのデータ入力 |
クラウド フローはクラウド上で動き、コネクタを通じてサービス同士をつなぎます。デスクトップ フローは Windows の PC 上で、人の代わりにマウスやキーボードを操作します。
! 「きっかけは何か」で種類を見分けます。イベント → 自動化、人 → インスタント、時間 → スケジュール済み、画面操作 → デスクトップ。
`},
{id:"4-2",t:"クラウド フローの構成",min:7,src:ML+"power-automate/getting-started",body:`
クラウド フローは「トリガー」と「アクション」の組み合わせでできています。
## トリガーとアクション
| 要素 | 説明 | 例 |
| トリガー | フローを開始するきっかけ。1 つのフローに 1 つ | Forms に新しい応答が送信されたとき |
| アクション | 実行する処理。複数を順番に並べる | 応答の詳細を取得 → SharePoint に項目を作成 → Teams に投稿 |
トリガーとアクションは、それぞれのサービスのコネクタが提供しています。
## 動的なコンテンツと式
前のステップの結果(メールの件名、フォームの回答など)は「動的なコンテンツ」として、後のアクションで使えます。さらに「式」を使うと、日付の計算や文字列の加工ができます。
> 例: 式 convertTimeZone(utcNow(), 'UTC', 'Tokyo Standard Time') で、現在の日本時間を取得する。
## 処理の流れを制御する
| 制御 | 役割 |
| 条件 | 「はい/いいえ」で処理を分ける |
| スイッチ | 値に応じて複数に分ける |
| それぞれに適用する (Apply to each) | 一覧の項目ごとに繰り返す |
| Do until | 条件を満たすまで繰り返す |
| 並列分岐 | 複数の処理を同時に進める |
| スコープ | 複数のアクションをまとめ、エラー処理などに使う |
フローの実行結果は「実行履歴」で確認でき、どのステップで失敗したかを調べられます。
! 1 つのフローに置けるトリガーは 1 つです。「前のステップの値を使う」→ 動的なコンテンツ。
`},
{id:"4-3",t:"よくある活用シナリオ",min:6,src:ML+"power-automate/get-started-approvals",body:`
試験では、Microsoft 365 のサービスと組み合わせた典型的なシナリオがよく出ます。
## 承認
申請を承認者に送り、承認・却下の結果に応じて処理を分けます。承認者は Teams、Outlook、Power Automate モバイル アプリから応答できます。
| 承認の種類 | 説明 |
| 承認/却下 - 最初の応答者 | 複数の承認者のうち、誰か 1 人が応答すれば完了 |
| 承認/却下 - 全員が承認 | 全員の承認が必要 |
| カスタム応答 | 「承認」「保留」「差し戻し」など独自の選択肢 |
| 順次承認 | 課長 → 部長のように順番に承認を回す(アクションを順に並べる) |
## Teams・Outlook・SharePoint・Forms
- Forms: 新しい応答が送信されたら、内容を SharePoint リストに登録する
- Outlook: 特定の件名のメールが届いたら、添付ファイルを OneDrive に保存する
- SharePoint: リストに項目が追加されたら、担当者にメールで通知する
- Teams: チャネルにメッセージやアダプティブ カード(ボタン付きのカード)を投稿する
> 例: 経費申請フォーム(Forms)→ 上司に承認依頼(承認)→ 承認されたら SharePoint に記録し、申請者に Teams で通知。
! Forms のトリガーの後には「応答の詳細を取得する」アクションが必要、という点も押さえておきましょう。
`},
{id:"4-4",t:"デスクトップ フローと RPA",min:6,src:ML+"power-automate/desktop-flows/introduction",body:`
RPA(ロボティック プロセス オートメーション)とは、人が PC で行う画面操作をソフトウェアのロボットに代行させる仕組みです。Power Automate では「デスクトップ フロー」として実現します。
## Power Automate for desktop
Windows 用のアプリ「Power Automate for desktop」でデスクトップ フローを作ります。
- レコーダー: 人の操作を記録して、フローを自動作成する
- アクション: ファイル操作、Excel 操作、Web ブラウザー操作、UI 要素のクリックなど数百種類
- API やコネクタがない古いシステムや、社内専用のアプリも自動化できる
## 有人と無人
| 実行方法 | 説明 | 例 |
| 有人 (attended) | ユーザーがサインインしている PC で、人と一緒に動く | 担当者が PC の前でボタンを押して実行 |
| 無人 (unattended) | 誰もサインインしていない PC で、自動で動く | 夜間にサーバーで大量のデータ入力を実行 |
クラウド フローからデスクトップ フローを呼び出すこともできます。たとえば「メールで届いた注文をクラウド フローで受け取り、古い基幹システムへの入力はデスクトップ フローで行う」という組み合わせが可能です。
! 「API がない」「画面操作を自動化」→ デスクトップ フロー。「誰もサインインしていない」→ 無人。
`},
{id:"4-5",t:"ドキュメント自動化と AI でのフロー作成",min:6,src:ML+"power-automate/create-cloud-flow-using-copilot",body:`
## ドキュメント自動化
請求書や申込書などの書類から、AI で必要な情報(請求番号、金額、日付など)を読み取り、システムへの登録までを自動化するシナリオです。
- メールや SharePoint に届いた PDF を受け取る
- AI モデルで文字や項目を抽出する
- 自信度が低い結果は、人が確認・修正する(Human in the loop)
- 確定したデータを Dataverse などに登録する
## Copilot でフローを作る
作りたい自動化を自然言語で説明すると、Copilot が必要なトリガーとアクションを組み合わせたフローを提案します。
> 例: 「SharePoint のリストに項目が追加されたら、内容を Teams のチャネルに投稿して」
作成後も「条件を追加して」「メールも送って」などと会話で修正できます。デスクトップ フローも AI を使って作成・修正できます。
## ライセンスの基本
| ライセンス | できること |
| Microsoft 365 に含まれる権利 | 標準コネクタを使ったクラウド フロー |
| Power Automate Premium | プレミアム コネクタ、有人のデスクトップ フローなど |
| Power Automate Process | 無人のデスクトップ フローなど、特定の自動化に割り当てる |
! スケジュール済みフローを日本で使うときは、タイム ゾーンを (UTC+09:00) 大阪、札幌、東京 に設定しましょう。
`}
],
5:[
{id:"5-1",t:"Copilot Studio とエージェント",min:5,src:ML+"microsoft-copilot-studio/fundamentals-what-is-copilot-studio",body:`
Copilot Studio は、会話型の AI エージェントをローコードで作成・管理するツールです。以前は Power Virtual Agents と呼ばれていました。
## エージェントとは
エージェントは、ユーザーと自然な言葉で会話し、質問に答えたり、処理を実行したりする AI です。
| 主な使い道 | 例 |
| 社内ヘルプデスク | IT の問い合わせ、パスワードの再設定案内 |
| 人事・総務の FAQ | 休暇制度、経費精算のルールへの回答 |
| 顧客サポート | Web サイトでの問い合わせ対応、注文状況の確認 |
| 業務の代行 | 休暇申請の登録、会議室の予約 |
## エージェントの主な構成要素
- 指示: エージェントの役割や話し方を自然言語で指定する
- ナレッジ: 回答の根拠にする情報源(Web サイト、SharePoint など)
- ツール: エージェントが実行できる処理(コネクタ、フローなど)
- トピック: 決まった会話の流れ
作りたいエージェントを自然言語で説明するだけで、作成を始めることもできます。
! 古い教材の「Power Virtual Agents」「ボット」は、現在の「Copilot Studio」「エージェント」と読み替えましょう。
`},
{id:"5-2",t:"トピックで会話を設計する",min:7,src:ML+"microsoft-copilot-studio/authoring-create-edit-topics",body:`
トピックは、特定の話題についての会話の流れをまとめたものです。「いつ始まるか(トリガー)」と「その後の流れ」を設計します。
## トピックの開始方法
- トリガー フレーズ: 「営業時間を教えて」「何時まで開いてる?」のような例文を登録する
- 説明による判断: トピックの内容を説明しておくと、AI がユーザーの意図に合うか判断する(生成オーケストレーション時)
## 会話を作るノード
| ノード | 役割 |
| メッセージの送信 | 文章や画像を表示する |
| 質問 | ユーザーに質問し、答えを変数に保存する |
| 条件 | 答えや変数の値によって流れを分ける |
| 変数の管理 | 値を保存・変更する |
| トピックの管理 | 別のトピックに移動する、会話を終了する |
| ツールの呼び出し | フローやコネクタを実行する |
| 生成型の回答 | ナレッジから AI で回答を作る |
## システム トピック
あらかじめ用意されている特別なトピックです。
| トピック | 動くタイミング |
| 会話の開始 | 会話が始まったときの挨拶 |
| フォールバック | どのトピックにも当てはまらないとき |
| エスカレート | 人の担当者に引き継ぐとき |
| 会話の終了 | 会話を締めくくるとき |
| エラー時 | エラーが起きたとき |
! 「理解できなかったときに動く」→ フォールバック、「人に引き継ぐ」→ エスカレート。
`},
{id:"5-3",t:"生成オーケストレーションとナレッジ",min:6,src:ML+"microsoft-copilot-studio/knowledge-copilot-studio",body:`
## オーケストレーションの 2 つの方式
| 方式 | 動き方 |
| クラシック | ユーザーの言葉がトリガー フレーズに一致したトピックを実行する |
| 生成オーケストレーション | AI がユーザーの意図を理解し、最適なトピック・ツール・ナレッジを選んで組み合わせる |
生成オーケストレーションでは、トピックやツールに書いた「説明」をもとに AI が判断するため、説明をわかりやすく書くことが大切です。1 つの質問に対して、複数のツールやナレッジを順に使って答えることもできます。
## ナレッジ ソース
ナレッジ ソースを追加すると、エージェントはそこにある情報をもとに、生成 AI で回答を作ります。トピックを 1 つずつ作らなくても、幅広い質問に答えられるようになります。
- 公開 Web サイト
- SharePoint のサイトやファイル
- アップロードしたファイル(PDF、Word など)
- Dataverse のテーブル
- その他のエンタープライズ データ(コネクタ経由)
回答には出典(どの資料から答えたか)が表示されるため、ユーザーは元の情報を確認できます。また、ユーザーの権限で見られない SharePoint の情報は回答に使われません。
! 「社内文書をもとに答えさせたい」→ ナレッジ ソースを追加する。
`},
{id:"5-4",t:"ツール:コネクタ・エージェント フロー・MCP",min:6,src:ML+"microsoft-copilot-studio/",body:`
ツールを追加すると、エージェントは情報を答えるだけでなく、実際に処理を実行できるようになります(以前は「アクション」「プラグイン」と呼ばれていました)。
| ツールの種類 | 説明 | 例 |
| コネクタ | Power Platform のコネクタを呼び出す | Outlook で予定を作成、Dataverse に行を追加 |
| エージェント フロー | Copilot Studio の中で作る自動化フロー | 申請を登録して承認依頼を送る |
| MCP サーバー | 標準規格 MCP で外部のツールやデータに接続する | 社外サービスが提供する機能を利用 |
| プロンプト | 指示文を使って AI に文章の要約や分類をさせる | 問い合わせ内容を分類する |
| REST API | 外部の API を直接呼び出す | 独自システムとの連携 |
## エージェント フロー
エージェント フローは、決まった手順を毎回確実に実行したい部分に使います。AI の判断に任せる部分と、ルール通りに動かす部分を分けることで、信頼性の高いエージェントになります。
## MCP(Model Context Protocol)
MCP は、AI が外部のツールやデータにアクセスするための共通の接続規格です。USB のように「規格に合ったものなら差し込めばつながる」イメージで、MCP サーバーを接続すると、そのサーバーが提供する機能をエージェントがツールとして使えます。
! 「情報を答えさせたい」→ ナレッジ、「処理を実行させたい」→ ツール。
`},
{id:"5-5",t:"公開とチャネル",min:5,src:ML+"microsoft-copilot-studio/publication-fundamentals-publish-channels",body:`
エージェントを作ったら、テスト画面で動作を確認し、「公開」してから「チャネル」に配置します。
## 主なチャネル
| チャネル | 説明 |
| Teams と Microsoft 365 Copilot | 社員が普段使う Teams や Microsoft 365 Copilot の中で使う |
| Web サイト | 自社の Web サイトに埋め込む。デモ用の Web サイトもある |
| SharePoint | SharePoint のサイトにエージェントを配置する |
| モバイル アプリ・その他 | 独自のアプリや外部のメッセージング サービスと連携する |
| Dynamics 365 Customer Service | 人の担当者への引き継ぎ(エスカレーション)に使う |
## 認証
エージェントを使う人の認証方法を選べます。
- 認証なし: 誰でも使える(公開 Web サイト向け)
- Microsoft で認証: Teams など、組織のアカウントで自動的にサインイン
- 手動で認証: 独自の認証の仕組みを設定する
## 再公開を忘れずに
トピックやナレッジを変更しても、もう一度公開するまでユーザー側には反映されません。
! 「変更したのにユーザーに反映されない」→ 再公開していない、が典型的な答えです。
`},
{id:"5-6",t:"エージェントの管理:分析・評価・Agent 365",min:6,src:ML+"microsoft-copilot-studio/analytics-overview",body:`
エージェントは作って終わりではなく、使われ方を確認しながら改善していきます。
## 分析(利用状況と導入状況の監視)
| 指標 | 意味 |
| セッション数 | エージェントとの会話の数 |
| 解決率 | エージェントだけで問題が解決した割合 |
| エスカレーション率 | 人の担当者に引き継いだ割合 |
| 放棄率 | 途中で会話をやめた割合 |
| 満足度 (CSAT) | ユーザーが付けた評価 |
解決率が低いトピックや、よく聞かれているのに答えられていない質問を見つけて、トピックやナレッジを改善します。
## エージェント評価
想定される質問と期待する回答をテスト セットとして用意し、エージェントがどの程度正しく答えられるかをまとめて確認する機能です。公開前や変更後の品質チェックに使います(名称は変わる可能性があります)。
## Microsoft Agent 365
組織の中でエージェントが増えると、「どんなエージェントがあり、誰が作り、何にアクセスしているか」を管理する必要が出てきます。Agent 365 は、組織内のエージェントを一元的に把握・管理・保護するための仕組みです(新しい項目のため推測を含みます)。
## ガバナンス
Copilot Studio のエージェントにも、環境の分離や DLP ポリシーが適用されます。管理者は使用できるコネクタやナレッジ、公開できるチャネルを制限できます。
! この分野は 2026年7月の改訂で追加され、配点が 20〜25% と大きいので重点的に学びましょう。
`}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const weak=()=>Q.filter(q=>S.stats[q.id]&&S.stats[q.id].last===false); // 최근에 틀린 문제

// 일본 시간 기준 날짜 (YYYY-MM-DD)
const jst=(d=new Date())=>d.toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
function streak(){ // 연속 학습 일수
  let n=0,d=new Date();
  if(!S.days[jst(d)])d=new Date(d.getTime()-864e5); // 오늘 아직 안 했으면 어제부터 계산
  while(S.days[jst(d)]){n++;d=new Date(d.getTime()-864e5)}
  return n;
}
function daysLeft(){ // 시험까지 남은 일수
  if(!S.set.exam)return null;
  return Math.round((new Date(S.set.exam+"T00:00:00+09:00")-new Date(jst()+"T00:00:00+09:00"))/864e5);
}

  </div>`;

function md(src){
  let h="",list=false,tbl=[];
  const endList=()=>{if(list){h+="</ul>";list=false}};
  const endTbl=()=>{if(tbl.length){h+=`<div class="tbl"><table><thead><tr>${tbl[0].map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;tbl=[]}};
  for(const raw of src.trim().split("\n")){
    const l=raw.trim();
    if(!l){endList();endTbl();continue}
    if(l.startsWith("| ")){endList();tbl.push(l.slice(1,-1).split("|").map(s=>s.trim()));continue}
    endTbl();
    if(l.startsWith("- ")){if(!list){h+="<ul>";list=true}h+=`<li>${esc(l.slice(2))}</li>`;continue}
    endList();
    if(l.startsWith("## "))h+=`<h3>${esc(l.slice(3))}</h3>`;
    else if(l.startsWith("> ")){const m=l.slice(2).match(/^([^:：]{1,8})[:：]\s*(.*)$/);h+=`<div class="ex"><b>${esc(m?m[1]:"例")}</b>${esc(m?m[2]:l.slice(2))}</div>`}
    else if(l.startsWith("! "))h+=`<div class="tip"><b>試験のポイント</b>${esc(l.slice(2))}</div>`;
    else h+=`<p>${esc(l)}</p>`;
  }
  endList();endTbl();return h;
}

function studyUnit(d,i){

    <h1 style="font-size:.95rem">分野${d}・${esc(dom.name)}<small>単元 ${i+1} / ${us.length}</small></h1>
    <button class="icon-btn toc-btn" id="toc" aria-controls="side" aria-expanded="false">☰ 目次</button></header>
  <div class="doc">
    <aside class="side" id="side" aria-label="目次">
      <div class="side-head"><b>分野${d}</b><span>${esc(dom.name)}</span></div>
      <ol>${us.map((x,k)=>`<li><button data-u="${k}" class="${k===i?"cur":""}"><span class="ck">${isRead(x)?"✓":k+1}</span><span>${esc(x.t)}</span></button></li>`).join("")}</ol>

      ${md(u.body)}

      <div class="pager">
        <button class="btn" id="prev" ${i?"":"disabled"}>‹ 前へ</button>
        <button class="btn primary" id="next">${last?"完了して問題を解く ›":"完了して次へ ›"}</button>

  const side=$("#side"), scrim=$("#scrim"), tocB=$("#toc");
  const drawer=o=>{side.classList.toggle("open",o);scrim.hidden=!o;tocB.setAttribute("aria-expanded",o)};
  tocB.onclick=()=>drawer(!side.classList.contains("open"));

  $("#next").onclick=()=>{
    S.read["u"+u.id]=1; save();

}

  let c=0,t=0;Object.values(S.stats).forEach(s=>{c+=s.c;t+=s.c+s.w});

    <button class="btn" data-mode="mark" data-title="ブックマーク" ${marked().length?"":"disabled"}>ブックマーク<small>${marked().length} 問 ›</small></button>

    return `<button class="domain" data-dom="${d.id}">
      <div class="row"><span class="name">分野${d.id}・${esc(d.name)}</span><span class="w">配点 ${d.w}</span></div>

      <span class="meta">正解済み ${ok} / ${qs.length} 問</span></button>`}).join("")}</div>

    const m=b.dataset.mode;
    const list=m==="rand"?shuffle(Q).slice(0,n):m==="weak"?shuffle(weak()):m==="mark"?shuffle(marked()):shuffle(Q);
    start(list,b.dataset.title);
  });
  document.querySelectorAll("[data-dom]").forEach(b=>b.onclick=()=>{const d=+b.dataset.dom;start(shuffle(Q.filter(q=>q.d===d)),DOMAINS[d-1].name)});
}

// ===== 퀴즈 진행 =====
function start(list,title){$("#app").classList.remove("wide");run={list,title,i:0,ok:0,wrong:[]};$("#tabs").hidden=true;show()}
function show(){
  const q=run.list[run.i], d=DOMAINS[q.d-1];
  // 선택지 순서 섞기 (설정에서 끌 수 있음)
  const order=S.set.shuffle?shuffle(q.c.map((_,k)=>k)):q.c.map((_,k)=>k);
  $("#app").innerHTML=`
  <header class="top"><button class="icon-btn" id="quit">‹ 終了</button><h1 style="font-size:.95rem">${esc(run.title)}</h1></header>
  <div class="qhead"><span class="tag">分野${q.d}</span><span>${esc(d.name)}</span><span class="count">${run.i+1} / ${run.list.length}</span></div>
  <div class="qbar"><i style="width:${run.i/run.list.length*100}%"></i></div>
  <p class="question">${esc(q.q)}</p>
  <div class="choices">${order.map((k,n)=>`<button class="choice" data-k="${k}"><span class="k">${"ABCD"[n]}</span><span>${esc(q.c[k])}</span></button>`).join("")}</div>
  <div id="after"></div>`;
  $("#quit").onclick=()=>go(tab);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(q,+b.dataset.k,order));
  window.scrollTo(0,0);
}
function answer(q,k,order){
  const right=k===q.a;
  const s=S.stats[q.id]||{c:0,w:0};
  right?s.c++:s.w++; s.last=right; S.stats[q.id]=s;
  S.days[jst()]=(S.days[jst()]||0)+1; save(); // 오늘 푼 문제 수 기록
  right?run.ok++:run.wrong.push(q);
  document.querySelectorAll(".choice").forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.a)b.classList.add("ok"); else if(bk===k)b.classList.add("ng");
  });
  const letter="ABCD"[order.indexOf(q.a)], last=run.i===run.list.length-1;
  $("#after").innerHTML=`
  <div class="verdict ${right?"ok":"ng"}">${right?"○ 正解":"× 不正解"}</div>
  <div class="exp">
    <h3>正解 ${letter}</h3><p><b>${esc(q.c[q.a])}</b></p>
    <h3>解説</h3><p>${esc(q.e)}</p>
    <div class="plus"><h3>補足・覚え方</h3><p>${esc(q.n)}</p></div>
    <p><a href="${DOMAINS[q.d-1].learn}" target="_blank" rel="noopener">この分野を Microsoft Learn で学ぶ ↗</a></p>
  </div>
  <div class="actions">
    <button class="btn mark ${S.marks[q.id]?"on":""}" id="mark">${S.marks[q.id]?"★ 保存済み":"☆ 保存"}</button>
    <button class="btn primary" id="next">${last?"結果を見る":"次の問題 ›"}</button>
  </div>`;
  $("#mark").onclick=e=>{S.marks[q.id]?delete S.marks[q.id]:S.marks[q.id]=1;save();
    e.currentTarget.classList.toggle("on",!!S.marks[q.id]);e.currentTarget.textContent=S.marks[q.id]?"★ 保存済み":"☆ 保存"};
  $("#next").onclick=()=>{last?result():(run.i++,show())};
  $("#after").scrollIntoView({behavior:"smooth",block:"start"});
}
function result(){
  const n=run.list.length, pct=Math.round(run.ok/n*100);
  const msg=pct>=70?"合格ライン(1000点中700点)の目安を超えています。":"合格の目安は正答率 70% 前後です。間違えた問題を復習しましょう。";
  $("#app").innerHTML=`
  <header class="top"><h1>結果<small>${esc(run.title)}</small></h1></header>
  <div class="score"><b>${pct}%</b><p>${run.ok} / ${n} 問 正解</p><p style="margin-top:8px">${msg}</p></div>
  ${run.wrong.length?`<h2>間違えた問題</h2><div class="review">${run.wrong.map(q=>`<div>${esc(q.q)}<small>正解: ${esc(q.c[q.a])}</small></div>`).join("")}</div>`:""}
  <div class="actions" style="margin-top:24px">
    ${run.wrong.length?`<button class="btn" id="retry">間違えた問題を解き直す</button>`:""}
    <button class="btn primary" id="back">戻る</button>
  </div>`;
  $("#back").onclick=()=>go(tab);
  if(run.wrong.length)$("#retry").onclick=()=>start(shuffle(run.wrong),"解き直し");
  window.scrollTo(0,0);
}

  <p class="note">個人学習用の非公式アプリです。Microsoft とは関係ありません。学習記録はこの端末のブラウザーにだけ保存されます。</p>`;

  // 세그먼트 버튼 (테마·글자크기·목표·문제 수)

    try{navigator.clipboard.writeText(ta.value).then(()=>msg("コピーしました。メモ帳などに保存してください。"),fb)}catch(e){fb()}

  $("#restore").onclick=()=>{

applySettings();
